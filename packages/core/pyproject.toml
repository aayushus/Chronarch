[project]
name = "chronarch-core"
version = "0.1.0"
description = "Shared calendar engine: models, permissions, availability, connectors, sync, audit, AI tools"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "alembic>=1.13",
    "icalendar>=5.0",
    "python-dateutil>=2.8",
    "cryptography>=42.0",
    "redis>=5.0",
    "greenlet>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "freezegun>=1.4", "aiosqlite>=0.20"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chronarch_core*"]
