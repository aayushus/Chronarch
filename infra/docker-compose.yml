name: chronarch

x-python-env: &python-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chronarch}:${POSTGRES_PASSWORD:-chronarch}@postgres:5432/${POSTGRES_DB:-chronarch}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — see .env.example}
  ALLOW_INSECURE_DEV_SECRET: ${ALLOW_INSECURE_DEV_SECRET:-}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-${APP_BASE_URL:-http://localhost:3000}}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
  MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
  MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
  MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev}
  LITELLM_DYNAMIC_DIR: /srv/litellm-dynamic


volumes:
  # API-written, litellm-consumed: UI-managed proxy config (Settings > AI /
  # LiteLLM). Holds the OpenRouter key when set via UI — same secrecy level
  # as .env. Empty until an admin first saves AI settings.
  litellm-dynamic:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronarch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-chronarch}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-chronarch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Local dev convenience — remove/comment out in production and reach
      # postgres only via the compose network (behind your reverse proxy +
      # firewall). BRD §28 expects a reverse proxy in front of web/api/mcp
      # for TLS termination; compose does not ship one — terminate TLS
      # upstream (Caddy/nginx/Traefik) and set APP_BASE_URL/CORS_ORIGINS to
      # the public origin. Host port is configurable when 5432 is taken
      # (e.g. by another project's DB): POSTGRES_HOST_PORT=5433.
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *python-env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /srv/apps/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment: *python-env
    volumes:
      - litellm-dynamic:/srv/litellm-dynamic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    build:
      context: ..
      dockerfile: apps/mcp/Dockerfile
    environment: *python-env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment: *python-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build:
      context: ..
      dockerfile: apps/scheduler/Dockerfile
    environment: *python-env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; me=str(os.getpid()); assert any('app.beat' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit() and p != me), 'beat not running'\""]
      interval: 30s
      timeout: 10s
      retries: 3

  litellm:
    build:
      context: ../packages/litellm-config
    environment:
      # Provider keys are NOT taken from .env — Settings > AI & Copilot stores
      # them encrypted in the DB and the API renders them into the watched
      # /app/dynamic/litellm.env. Only the proxy master key lives here.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev}
    volumes:
      # UI-managed config from the API (Settings > AI / LiteLLM). Read-only
      # here; the entrypoint watches /app/dynamic/config.yaml + litellm.env
      # and reloads itself within seconds of a save — no manual restart.
      - litellm-dynamic:/app/dynamic:ro
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Host port configurable when 3000 is taken: WEB_HOST_PORT=3100.
      # Keep APP_BASE_URL in sync — it builds the OAuth redirect URI.
      - "${WEB_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
