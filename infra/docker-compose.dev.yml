# Dev overlay: hot-reload for api/web instead of rebuilding images on every
# change. Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    volumes:
      - ../apps/api/app:/srv/apps/api/app
      - ../packages/core/chronarch_core:/srv/packages/core/chronarch_core
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile.dev
    volumes:
      - ../apps/web/src:/srv/src
      - ../apps/web/index.html:/srv/index.html
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]
