name: chronarch

services:
  postgres:
    container_name: chronarch-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-chronarch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: chronarch-redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    container_name: chronarch-migrate
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-api:${TAG:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /srv/apps/api
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    container_name: chronarch-api
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-api:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./volumes/litellm-dynamic:${LITELLM_DYNAMIC_DIR:-/srv/litellm-dynamic}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_HOST_PORT:-28000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp:
    container_name: chronarch-mcp
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-mcp:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MCP_HOST_PORT:-28001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    container_name: chronarch-worker
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-worker:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    container_name: chronarch-scheduler
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-scheduler:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; me=str(os.getpid()); assert any('app.beat' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit() and p != me), 'beat not running'\""]
      interval: 30s
      timeout: 10s
      retries: 3

  litellm:
    container_name: chronarch-litellm
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-litellm:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./volumes/litellm-dynamic:/app/dynamic:ro
    ports:
      - "${LITELLM_HOST_PORT:-24000}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    container_name: chronarch-web
    image: ghcr.io/${GHCR_REPO_OWNER:-aayushus}/chronarch-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-23000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
