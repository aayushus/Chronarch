[project]
name = "chronarch-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic[email]>=2.13.5",
    "uvicorn[standard]>=0.53.0",
    "chronarch-core",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7",
    # Passlib's bcrypt backend is incompatible with bcrypt 5.x's changed
    # 72-byte validation and backend metadata. Keep the runtime pinned until
    # the password hashing implementation is migrated away from Passlib.
    "bcrypt==4.0.1",
    "python-multipart>=0.0.32",
    "celery[redis]>=5.6.3",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
