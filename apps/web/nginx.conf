server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: the api hostname MUST go through a variable + resolver (not a
    # literal in proxy_pass). Nginx resolves literal upstreams once at
    # startup and caches the container IP forever — recreating the api
    # container (rebuild/redeploy) then 502s until web is also restarted.
    # Docker's embedded DNS (127.0.0.11) with a short TTL re-resolves per
    # request. No URI part on proxy_pass: the full original URI (including
    # the /api/ prefix FastAPI routes expect) is passed through unchanged.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
