[project]
name = "chronarch-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3",
    "chronarch-core",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
