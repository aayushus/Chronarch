[tool.pytest.ini_options]
asyncio_mode = "auto"
# Relative paths resolve from the repo root both locally and in containers
# (run container tests from /srv, e.g. `cd /srv && python -m pytest -q`).
# API tests import fastapi (present in the api image; installed for local runs
# per README), so single-file runs from the root keep rootdir at the repo root.
testpaths = ["packages/core/tests", "apps/api/tests"]
pythonpath = ["packages/core", "apps/api", "apps/mcp"]
