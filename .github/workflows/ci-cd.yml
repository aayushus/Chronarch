name: CI/CD - Build & Push Container Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      mcp: ${{ steps.filter.outputs.mcp }}
      worker: ${{ steps.filter.outputs.worker }}
      scheduler: ${{ steps.filter.outputs.scheduler }}
      litellm: ${{ steps.filter.outputs.litellm }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # On tag push or workflow_dispatch, consider everything changed
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci-cd.yml'
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'pyproject.toml'
              - '.github/workflows/ci-cd.yml'
            mcp:
              - 'apps/mcp/**'
              - 'packages/core/**'
              - '.github/workflows/ci-cd.yml'
            worker:
              - 'apps/worker/**'
              - 'packages/core/**'
              - '.github/workflows/ci-cd.yml'
            scheduler:
              - 'apps/scheduler/**'
              - 'packages/core/**'
              - '.github/workflows/ci-cd.yml'
            litellm:
              - 'packages/litellm-config/**'
              - '.github/workflows/ci-cd.yml'

  build-and-push:
    name: Build & Push Docker Images (${{ matrix.name }})
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
            image-name: chronarch-web
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
            image-name: chronarch-api
          - name: mcp
            context: .
            dockerfile: apps/mcp/Dockerfile
            image-name: chronarch-mcp
          - name: worker
            context: .
            dockerfile: apps/worker/Dockerfile
            image-name: chronarch-worker
          - name: scheduler
            context: .
            dockerfile: apps/scheduler/Dockerfile
            image-name: chronarch-scheduler
          - name: litellm
            context: packages/litellm-config
            dockerfile: packages/litellm-config/Dockerfile
            image-name: chronarch-litellm

    # Run if the specific component changed, or if it's a tag push / manual workflow dispatch
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      needs.detect-changes.outputs[matrix.name] == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image-name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image-name }}
