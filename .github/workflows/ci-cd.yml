name: CI/CD - Build & Push Container Images to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-targets: ${{ steps.set-matrix.outputs.has-targets }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - '.github/workflows/ci-cd.yml'
            api:
              - 'apps/api/**'
              - 'packages/core/**'
              - 'pyproject.toml'
              - '.github/workflows/ci-cd.yml'
            mcp:
              - 'apps/mcp/**'
              - 'packages/core/**'
              - '.github/workflows/ci-cd.yml'
            worker:
              - 'apps/worker/**'
              - 'packages/core/**'
              - '.github/workflows/ci-cd.yml'
            scheduler:
              - 'apps/scheduler/**'
              - 'packages/core/**'
              - '.github/workflows/ci-cd.yml'
            litellm:
              - 'packages/litellm-config/**'
              - '.github/workflows/ci-cd.yml'

      - name: Build Target Matrix
        id: set-matrix
        run: |
          # If triggered manually (workflow_dispatch) or via version tag, build everything.
          BUILD_ALL="${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}"
          
          python3 -c "
          import json, os

          build_all = '$BUILD_ALL'.lower() == 'true'
          
          definitions = [
              {'name': 'web', 'context': '.', 'dockerfile': 'apps/web/Dockerfile', 'image-name': 'chronarch-web', 'changed': '${{ steps.filter.outputs.web }}'},
              {'name': 'api', 'context': '.', 'dockerfile': 'apps/api/Dockerfile', 'image-name': 'chronarch-api', 'changed': '${{ steps.filter.outputs.api }}'},
              {'name': 'mcp', 'context': '.', 'dockerfile': 'apps/mcp/Dockerfile', 'image-name': 'chronarch-mcp', 'changed': '${{ steps.filter.outputs.mcp }}'},
              {'name': 'worker', 'context': '.', 'dockerfile': 'apps/worker/Dockerfile', 'image-name': 'chronarch-worker', 'changed': '${{ steps.filter.outputs.worker }}'},
              {'name': 'scheduler', 'context': '.', 'dockerfile': 'apps/scheduler/Dockerfile', 'image-name': 'chronarch-scheduler', 'changed': '${{ steps.filter.outputs.scheduler }}'},
              {'name': 'litellm', 'context': 'packages/litellm-config', 'dockerfile': 'packages/litellm-config/Dockerfile', 'image-name': 'chronarch-litellm', 'changed': '${{ steps.filter.outputs.litellm }}'}
          ]

          targets = [d for d in definitions if build_all or d['changed'] == 'true']
          # Remove internal flag before generating matrix JSON
          for t in targets:
              del t['changed']

          matrix_json = json.dumps({'include': targets})
          has_targets = 'true' if len(targets) > 0 else 'false'

          github_output = os.environ.get('GITHUB_OUTPUT')
          with open(github_output, 'a') as f:
              f.write(f'matrix={matrix_json}\n')
              f.write(f'has-targets={has_targets}\n')
          print('Selected build targets:', [t['name'] for t in targets])
          "

  build-and-push:
    name: Build & Push Docker Images (${{ matrix.name }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has-targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image-name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image-name }}
